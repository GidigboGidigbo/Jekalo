# Template for the local docker-compose.yml (which is gitignored).
# Copy to docker-compose.yml and provide the required env vars (e.g. via .env).
services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    container_name: jekalo-postgres
    restart: unless-stopped
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jekalo-pgdata:/var/lib/postgresql/data

volumes:
  jekalo-pgdata:
